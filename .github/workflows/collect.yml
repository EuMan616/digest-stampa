name: Digest stampa - verifica feed (fase 1)
 
on:
  workflow_dispatch:
 
jobs:
  raccolta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raccolta
          path: data/
