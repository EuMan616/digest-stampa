# ============================================================================
#  REGISTRO FONTI - digest stampa (notizie legge/finanza/mercati/business)
# ============================================================================
#  Stesso motore del digest normativo. Differenze:
#   - ogni fonte ha un tag "regione: ita | estero" (per dividere l'email);
#   - si usano SOLO i feed RSS (titolo + sommario della testata + link):
#     niente recupero dell'articolo integrale (copyright + paywall).
#
#  "url" puo' essere una stringa o un elenco di candidati (provati in ordine).
#  Se un URL e' una pagina (non un feed), il programma cerca da solo il feed
#  dichiarato nell'HTML (auto-rilevamento). Diversi URL qui sono CANDIDATI da
#  confermare con la prima esecuzione.
# ============================================================================

